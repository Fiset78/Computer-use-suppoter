# Baba Is You (PC, Steam). 턴제 퍼즐이라 시점 회전·누르고 있기 도구가 필요 없다.
# 게임 설정 권장: 창 모드 (창 모드에서 Ctrl+1/2/3으로 창 크기 변경), 설정에서 파티클 효과 끄기
# (화면이 덜 어수선해 스크린샷을 읽기 쉬움). 조작키를 바꿨다면 아래 prompt의 키도 같이 고친다.
name = "Baba Is You"
mode = "game"
window = "Baba Is You"              # 이 문자열이 제목에 들어간 창만 캡처·조작
input = "directinput"               # 키가 안 먹으면 "pyautogui"로 바꿔 시험
assist = []                         # 턴제 퍼즐: 기본 key 도구로 충분 (hold로 방향키를 누르고 있으면 여러 칸 움직임)
memory = "memory/babaisyou.md"      # 레벨별로 알아낸 규칙과 풀이 요령을 저장
max_steps = 100                     # 퍼즐은 시행착오가 많다
action_delay = 0.3                  # 한 턴의 이동 애니메이션이 끝날 시간

prompt = """
[조작 (기본 키 배치)]
- 이동: 방향키 (또는 W/A/S/D). 한 번 누르면 한 칸, 한 턴입니다.
- 기다리기(한 턴 넘기기): space
- 되돌리기: z (한 턴씩, 횟수 제한 없음). 실수했거나 YOU가 없어져 움직일 수 없으면 바로 z를 누르세요.
- 레벨 다시 시작: r
- 일시정지 메뉴: Escape (레벨 나가기, 설정)
- 지도 화면에서 레벨 들어가기: 레벨 위로 이동한 뒤 Return(또는 space)

[입력 요령]
- 빠르게 연달아 누르면 입력이 씹힐 수 있습니다. 같은 방향으로 여러 칸 갈 때는 key 도구의 repeat를 3~4 이하로 쓰고,
  매번 스크린샷으로 실제로 몇 칸 갔는지 확인하세요.
- 키를 누르고 있지 마세요 (hold_key 금지). 누르고 있으면 키 반복으로 여러 칸 움직입니다.

[게임 규칙]
- 화면의 글자 블록이 규칙을 만듭니다. "명사 IS 속성" 또는 "명사 IS 명사"가 왼쪽→오른쪽 또는 위→아래로 붙어 있으면 그 규칙이 켜집니다.
- 글자 블록은 언제나 밀 수 있습니다. 글자를 밀어 규칙을 만들거나 끊는 것이 퍼즐의 핵심입니다.
- YOU인 물체를 조종합니다. YOU인 물체가 WIN인 물체에 닿으면 레벨을 깹니다.
- 자주 나오는 속성: STOP 막힘, PUSH 밀 수 있음, DEFEAT 닿으면 YOU가 사라짐, SINK 닿은 것과 함께 사라짐,
  HOT/MELT 뜨거운 곳에 MELT가 닿으면 사라짐, OPEN/SHUT 서로 닿으면 둘 다 사라짐, MOVE 매 턴 스스로 움직임, WIN 목표.
- "BABA IS YOU" 같은 YOU 규칙이 끊기면 아무것도 움직일 수 없습니다. 그때는 z로 되돌리세요.

[푸는 순서]
1. 먼저 화면의 모든 규칙(가로·세로로 이어진 글자)을 읽고 적어 보세요. 작은 글자는 zoom으로 확인하세요.
2. 어떤 규칙을 만들거나 끊으면 목표에 닿을 수 있는지 계획을 세운 뒤 움직이세요.
3. 글자를 미는 방향과 미는 위치(글자의 반대편)를 확인하고, 몇 칸씩 끊어서 움직이며 결과를 보세요.
4. 막히면 r로 다시 시작하거나 z로 되돌려 다른 방법을 시도하세요. 되돌리기는 손해가 없습니다.
"""
