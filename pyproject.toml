[project]
name = "pc-agent"
version = "0.1.0"
description = "Claude computer use를 보조하는 Windows용 에이전트 하네스 (리서치용)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "claude-agent-sdk>=0.2.163",
    "mss>=9.0",
    "pillow>=10.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "pydirectinput-rgx>=2.1; sys_platform == 'win32'",
    # 실행 창의 음성 입력 (내 PC에서 음성 인식)
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
